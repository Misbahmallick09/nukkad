<body>
<a class="skip-link" href="#view">Skip to main content</a>

<!-- ============ announcement marquee ============ -->
<div class="announce" id="announce">
  <div class="announce__track" id="announceTrack" aria-live="off"></div>
  <button class="announce__close" id="announceClose" type="button" aria-label="Hide offer bar">&times;</button>
</div>

<!-- ============ header ============ -->
<header class="hdr" id="hdr">
  <div class="hdr__bar">
    <button class="hdr__burger" id="burger" type="button" aria-label="Open menu" aria-expanded="false" aria-controls="mdrawer">
      <span></span><span></span><span></span>
    </button>

    <a class="brand" href="#/" aria-label="NUKKAD home">
      <span class="brand__mark" aria-hidden="true">
        <svg viewBox="0 0 32 32" width="30" height="30"><rect width="32" height="32" rx="7" fill="#0C3B2E"/><path d="M8 24V8h4l8 10V8h4v16h-4L12 14v10z" fill="#FFB703"/></svg>
      </span>
      <span class="brand__type">
        <span class="brand__word">NUKKAD</span>
        <span class="brand__tag">off the corner</span>
      </span>
    </a>

    <nav class="nav" id="primaryNav" aria-label="Main">
      <ul class="nav__list" id="navList"></ul>
    </nav>

    <div class="hdr__search" role="search">
      <form class="srch" id="srchForm" autocomplete="off" action="#/search">
        <svg class="srch__icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input class="srch__input" id="srchInput" type="search" name="q" placeholder="Search for oversized tees, hoodies, caps…"
               aria-label="Search products" aria-expanded="false" aria-controls="srchPanel" role="combobox" aria-autocomplete="list">
        <button class="srch__clear" id="srchClear" type="button" aria-label="Clear search" hidden>&times;</button>
      </form>
      <div class="srch__panel" id="srchPanel" hidden></div>
    </div>

    <div class="hdr__acts">
      <button class="iconbtn iconbtn--search" id="mobSearchBtn" type="button" aria-label="Search">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      </button>

      <div class="acct" id="acctWrap">
        <button class="iconbtn" id="acctBtn" type="button" aria-label="Account" aria-expanded="false" aria-haspopup="true">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8.5" r="3.6"/><path d="M4.8 20c1.2-3.7 3.9-5.5 7.2-5.5s6 1.8 7.2 5.5"/></svg>
          <span class="iconbtn__label" id="acctLabel">Account</span>
        </button>
        <div class="acct__menu" id="acctMenu" hidden></div>
      </div>

      <a class="iconbtn" href="#/track" aria-label="Track your order">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7h11v10H3z"/><path d="M14 10h4l3 3v4h-7z"/><circle cx="7" cy="18.5" r="1.8"/><circle cx="17" cy="18.5" r="1.8"/></svg>
        <span class="iconbtn__label">Track</span>
      </a>

      <a class="iconbtn" href="#/wishlist" aria-label="Wishlist">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20s-7.5-4.6-7.5-9.4A4.1 4.1 0 0 1 12 8.2a4.1 4.1 0 0 1 7.5 2.4C19.5 15.4 12 20 12 20z"/></svg>
        <span class="iconbtn__label">Wishlist</span>
        <span class="badge" id="wishBadge" hidden>0</span>
      </a>

      <a class="iconbtn" id="cartBtn" href="#/cart" aria-label="Shopping bag">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 8h12l-1 12H7L6 8z"/><path d="M9.2 8V6.6a2.8 2.8 0 0 1 5.6 0V8"/></svg>
        <span class="iconbtn__label">Bag</span>
        <span class="badge" id="cartBadge" hidden>0</span>
      </a>
    </div>
  </div>

  <div class="mega" id="mega" hidden></div>
</header>
<!-- ============ mobile drawer ============ -->
<div class="scrim" id="scrim" hidden></div>
<aside class="mdrawer" id="mdrawer" hidden aria-label="Browse menu">
  <div class="mdrawer__head">
    <span class="mdrawer__title">Browse</span>
    <button class="mdrawer__x" id="mdrawerClose" type="button" aria-label="Close menu">&times;</button>
  </div>
  <div class="mdrawer__body" id="mdrawerBody"></div>
</aside>

<!-- ============ mobile search sheet ============ -->
<div class="msearch" id="msearch" hidden>
  <div class="msearch__bar">
    <button class="msearch__back" id="msearchBack" type="button" aria-label="Close search">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 6l-6 6 6 6"/></svg>
    </button>
    <input class="msearch__input" id="msearchInput" type="search" placeholder="Search NUKKAD" aria-label="Search products" autocomplete="off">
    <button class="msearch__clear" id="msearchClear" type="button" aria-label="Clear" hidden>&times;</button>
  </div>
  <div class="msearch__panel" id="msearchPanel"></div>
</div>

<!-- ============ routed view ============ -->
<main id="view" class="view" tabindex="-1"></main>

<!-- ============ footer ============ -->
<footer class="ftr" id="ftr"></footer>

<!-- ============ mobile bottom nav ============ -->
<nav class="bnav" id="bnav" aria-label="Quick navigation">
  <a class="bnav__i" href="#/" data-bnav="home">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 11l8-6.5 8 6.5v8a1 1 0 0 1-1 1h-4v-5h-6v5H5a1 1 0 0 1-1-1z"/></svg><span>Home</span>
  </a>
  <a class="bnav__i" href="#/c/men" data-bnav="men">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 4h6l4 2.5-2 3-1-.6V20H8V8.9l-1 .6-2-3z"/></svg><span>Men</span>
  </a>
  <a class="bnav__i" href="#/c/women" data-bnav="women">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4l4 4-2.5 3L18 20H6l4.5-9L8 8z"/></svg><span>Women</span>
  </a>
  <a class="bnav__i" href="#/wishlist" data-bnav="wishlist">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20s-7.5-4.6-7.5-9.4A4.1 4.1 0 0 1 12 8.2a4.1 4.1 0 0 1 7.5 2.4C19.5 15.4 12 20 12 20z"/></svg><span>Wishlist</span>
    <span class="bnav__dot" id="bnavWish" hidden></span>
  </a>
  <a class="bnav__i" href="#/cart" data-bnav="cart">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 8h12l-1 12H7L6 8z"/><path d="M9.2 8V6.6a2.8 2.8 0 0 1 5.6 0V8"/></svg><span>Bag</span>
    <span class="bnav__dot" id="bnavCart" hidden></span>
  </a>
</nav>

<!-- ============ overlays ============ -->
<div class="toasts" id="toasts" role="status" aria-live="polite" aria-atomic="false"></div>
<div class="modal" id="modal" hidden role="dialog" aria-modal="true" aria-labelledby="modalTitle">
  <div class="modal__scrim" data-close="1"></div>
  <div class="modal__box" id="modalBox">
    <button class="modal__x" id="modalClose" type="button" aria-label="Close">&times;</button>
    <div class="modal__content" id="modalContent"></div>
  </div>
</div>
<div class="pageload" id="pageload" hidden><span class="pageload__bar"></span></div>

<script src="assets/js/data.js" defer></script>
<script src="assets/js/imagery.js" defer></script>
<script src="assets/js/store.js" defer></script>
<script src="assets/js/ui.js" defer></script>
<script src="assets/js/views.js" defer></script>
<script src="assets/js/account.js" defer></script>
<script src="assets/js/app.js" defer></script>
</body>
</html>
